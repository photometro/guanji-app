server:
  address: 0.0.0.0
  port: ${GUANJI_SERVER_PORT:8080}

spring:
  application:
    name: guanji-thesis-server
  datasource:
    url: ${GUANJI_DB_URL:jdbc:postgresql://localhost:5432/guanji_thesis}
    username: ${GUANJI_DB_USER:guanji}
    password: ${GUANJI_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

guanji:
  privacy:
    mode: local-lan-only
    raw-record-upload: false
