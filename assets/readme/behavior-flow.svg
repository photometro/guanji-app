<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">观己的本地行为观察流程</title>
  <desc id="desc">个人记录、个人模型和本地洞悉留在设备内。用户启用 AI 时，服务商只接收聚合摘要。</desc>

  <rect width="1200" height="500" rx="30" fill="#F2F2F7"/>

  <rect x="32" y="52" width="798" height="396" rx="28" fill="#FFFFFF" stroke="#D8DAE2" stroke-width="2"/>
  <text x="68" y="106" fill="#3A3A3C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="34" font-weight="650">设备本地</text>
  <text x="790" y="106" text-anchor="end" fill="#8E8E93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="30" font-weight="500">记录默认不上传</text>

  <g id="local-flow" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="64" y="178" width="212" height="154" rx="22" fill="#F8F9FC" stroke="#D8DAE2" stroke-width="2"/>
    <rect x="322" y="178" width="212" height="154" rx="22" fill="#F8F9FC" stroke="#D8DAE2" stroke-width="2"/>
    <rect x="580" y="178" width="212" height="154" rx="22" fill="#EAF3FF" stroke="#A9CCFF" stroke-width="2"/>
    <path d="M282 255H312" stroke="#8E8E93" stroke-width="3"/>
    <path d="m305 248 8 7-8 7" stroke="#8E8E93" stroke-width="3"/>
    <path d="M540 255H570" stroke="#8E8E93" stroke-width="3"/>
    <path d="m563 248 8 7-8 7" stroke="#8E8E93" stroke-width="3"/>
    <path d="M428 178V148H918V168" stroke="#007AFF" stroke-width="3" stroke-dasharray="8 9"/>
    <path d="m910 160 8 10 8-10" stroke="#007AFF" stroke-width="3"/>
  </g>

  <g fill="#3A3A3C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="50" font-weight="650" text-anchor="middle">
    <text x="170" y="274">记录</text>
    <text x="428" y="274">个人模型</text>
  </g>
  <text x="686" y="274" text-anchor="middle" fill="#007AFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="50" font-weight="650">本地洞悉</text>
  <text x="68" y="402" fill="#8E8E93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="30" font-weight="500">完整记录与原始时间留在本机</text>

  <text x="716" y="143" text-anchor="middle" fill="#007AFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="30" font-weight="600">仅聚合摘要</text>
  <rect x="864" y="178" width="294" height="154" rx="22" fill="#FFFFFF" stroke="#A9CCFF" stroke-width="2"/>
  <text x="1011" y="256" text-anchor="middle" fill="#007AFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="50" font-weight="650">可选 AI</text>
  <text x="1011" y="294" text-anchor="middle" fill="#8E8E93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="30" font-weight="500">增强观察</text>
  <text x="864" y="402" fill="#8E8E93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="500">由用户配置服务商</text>
</svg>
