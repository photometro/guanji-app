<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PROTOTYPE #132 · 语义替换方案</title>
  <link rel="icon" href="data:,">
  <!--
    THROWAWAY PROTOTYPE — 不属于生产代码。
    问题：在不增加记录步骤的情况下，直接把“情绪/诱因”升级为时间关系更清楚的字段。
    运行：python -m http.server 8123 --directory www
  -->
  <style>
    :root {
      --bg:#f2f2f7; --bg-elev:#e8e8ee; --card:#fff; --ink:#050505; --ink-2:#77777f; --ink-3:#b7b7bf;
      --accent:#087bff; --accent-deep:#0065d8; --accent-soft:#e8f1ff; --line:rgba(20,20,25,.09);
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink)}
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(70% 65% at 20% 10%,rgba(0,122,255,.13),transparent 68%),#dfe3eb;overflow:hidden}
    button{font:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
    .phone{position:relative;width:min(430px,100vw);height:min(920px,100vh);overflow:hidden;background:var(--bg);box-shadow:0 36px 90px rgba(34,40,54,.24)}
    .home{position:absolute;inset:0;padding:32px 26px;background:radial-gradient(80% 55% at 110% -10%,rgba(0,122,255,.08),transparent 66%),var(--bg)}
    .status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:38px}.status-icons{letter-spacing:2px}
    .date{color:var(--ink-2);font-size:13px;font-weight:650}.greeting{margin:9px 0 24px;font-size:31px;letter-spacing:-.04em}.hero{display:flex;align-items:center;justify-content:space-between}
    .hero-number{font-size:62px;font-weight:800;color:var(--accent-deep);letter-spacing:-.06em}.hero-number small{font-size:18px;color:var(--ink-2);margin-left:8px}
    .home-record{border:0;padding:15px 25px;border-radius:22px;background:linear-gradient(135deg,#1488ff,#0067d9);color:#fff;font-weight:750;font-size:18px;box-shadow:0 12px 25px rgba(0,98,204,.22)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:22px;padding-top:20px}.stat{text-align:center;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat b{display:block;font-size:28px}.stat span{color:var(--ink-2);font-size:12px}
    .trend{height:250px;border-radius:28px;background:rgba(255,255,255,.78);margin-top:24px;padding:22px}.trend h3{margin:0;font-size:19px}.fake-chart{height:130px;margin-top:28px;border-bottom:1px solid var(--line);position:relative}.fake-chart:after{content:"";position:absolute;left:3%;right:3%;top:48%;height:3px;background:linear-gradient(90deg,transparent 0 5%,#1488ff 5% 20%,#69b4ff 20% 35%,#1488ff 35% 57%,#69b4ff 57% 73%,#1488ff 73% 100%);transform:skewY(-9deg);border-radius:99px;opacity:.7}
    .scrim{position:absolute;inset:0;background:rgba(23,25,29,.40);backdrop-filter:blur(1.5px)}
    .badge{position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));left:14px;padding:6px 9px;border-radius:999px;background:rgba(0,0,0,.66);color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em}
    .sheet{position:absolute;z-index:5;left:12px;right:12px;bottom:0;max-height:calc(100% - 64px);overflow:auto;scrollbar-width:none;padding:13px 22px 28px;border-radius:34px 34px 0 0;background:rgba(252,252,253,.97);box-shadow:0 26px 70px rgba(0,0,0,.24);animation:up .45s cubic-bezier(.22,1.05,.36,1) both}.sheet::-webkit-scrollbar{display:none}
    @keyframes up{from{transform:translateY(12%);opacity:.4}to{transform:translateY(0);opacity:1}}
    .grab{width:42px;height:5px;border-radius:99px;background:#dedee5;margin:0 auto 14px}.head{display:flex;align-items:start;justify-content:space-between;margin-bottom:14px}.title{margin:0;font-size:23px;letter-spacing:-.025em}.sub{margin:5px 0 0;color:var(--ink-2);font-size:12px;line-height:1.5}.same-step{padding:7px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep);font-size:11px;font-weight:750;white-space:nowrap}
    .time-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.time-row b{font-size:13px}.time-row span{color:var(--ink-2)}
    .label-row{display:flex;align-items:baseline;justify-content:space-between;margin:15px 0 8px}.label-row strong{font-size:13px}.label-row span{color:var(--ink-3);font-size:10px}.helper{margin:-3px 0 8px;color:var(--ink-2);font-size:10px;line-height:1.45}
    .chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid transparent;border-radius:12px;padding:8px 10px;background:var(--bg-elev);color:var(--ink-2);font-size:11px;font-weight:650;transition:.18s}.chip:active{transform:scale(.94)}.chip.active{background:var(--accent-soft);color:var(--accent-deep);border-color:rgba(0,122,255,.16)}
    .section-note{display:flex;gap:8px;align-items:flex-start;margin-top:15px;padding:10px 11px;border-radius:14px;background:rgba(0,122,255,.055);color:var(--ink-2);font-size:10px;line-height:1.45}.info{width:15px;height:15px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);font-weight:800}
    .note-box{min-height:39px;padding:10px 12px;border-radius:13px;background:var(--bg-elev);color:var(--ink-3);font-size:11px}
    .actions{display:flex;gap:9px;margin-top:18px}.primary,.secondary{min-height:48px;border:0;border-radius:17px;padding:0 17px;font-weight:750}.primary{flex:1;color:#fff;background:linear-gradient(135deg,#1789ff,#0069df);box-shadow:0 10px 23px rgba(0,98,204,.2)}.secondary{color:var(--ink-2);background:var(--bg-elev)}
    .state{margin:12px 0 0;padding:9px 11px;border-radius:13px;background:#13161d;color:#fff;font:10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}
    .toast{position:absolute;z-index:20;left:50%;top:72px;transform:translate(-50%,-12px);opacity:0;pointer-events:none;padding:10px 14px;border-radius:13px;color:#fff;background:rgba(0,0,0,.78);font-size:12px;font-weight:700;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:480px){body{display:block;background:var(--bg)}.phone{width:100vw;height:100vh;box-shadow:none}.sheet{left:0;right:0;border-radius:31px 31px 0 0}}
  </style>
</head>
<body>
  <main class="phone">
    <div class="home" aria-hidden="true">
      <div class="status"><span>10:36</span><span class="status-icons">● ◼︎ ◒</span></div>
      <div class="date">8月18日 · 周二</div><h1 class="greeting">上午好，今天感觉如何？</h1>
      <div class="hero"><div class="hero-number">12<small>次</small></div><button class="home-record">＋ 记录</button></div>
      <div class="stats"><div class="stat"><b>9</b><span>近 7 天</span></div><div class="stat"><b>−10%</b><span>较上 7 天</span></div><div class="stat"><b>4</b><span>连续天数</span></div></div>
      <section class="trend"><h3>次数趋势</h3><div class="fake-chart"></div></section>
    </div>
    <div class="scrim"></div><div class="badge">PROTOTYPE · #132</div><div class="toast" id="toast">记录已保存</div>
    <section class="sheet">
      <div class="grab"></div>
      <div class="head"><div><h2 class="title">记录</h2><p class="sub">同一步完成，字段语义更清楚</p></div><span class="same-step">不增加步骤</span></div>
      <div class="time-row"><b>时间</b><span>8月18日 10:36</span></div>
      <div class="time-row"><b>时长</b><span>15 分钟</span></div>

      <div class="label-row"><strong>发生前相关情境（可多选）</strong><span>原「诱因」</span></div>
      <p class="helper">记录你观察到的背景，不代表确定的因果关系。</p>
      <div class="chips" data-group="context">
        <button class="chip active" data-value="无聊">无聊</button><button class="chip" data-value="压力">压力</button><button class="chip" data-value="睡不着">睡不着</button><button class="chip" data-value="睡前习惯">睡前习惯</button><button class="chip" data-value="成人内容影响">成人内容影响</button><button class="chip" data-value="无特别情境">无特别情境</button>
      </div>

      <div class="label-row"><strong>发生前状态（单选）</strong><span>新增观察字段</span></div>
      <div class="chips" data-group="before"><button class="chip" data-value="平静">平静</button><button class="chip active" data-value="无聊">无聊</button><button class="chip" data-value="压力">压力</button><button class="chip" data-value="焦虑">焦虑</button><button class="chip" data-value="孤独">孤独</button></div>

      <div class="label-row"><strong>当下感受（可多选）</strong><span>原「情绪」</span></div>
      <div class="chips" data-group="after"><button class="chip active" data-value="平静">平静</button><button class="chip" data-value="放松">放松</button><button class="chip" data-value="愉悦">愉悦</button><button class="chip" data-value="疲惫">疲惫</button><button class="chip" data-value="有些后悔">有些后悔</button></div>

      <div class="label-row"><strong>是否符合原本计划（可选）</strong><span>不影响保存</span></div>
      <div class="chips" data-group="plan"><button class="chip" data-value="符合">符合</button><button class="chip" data-value="部分符合">部分符合</button><button class="chip" data-value="不符合">不符合</button></div>
      <div class="section-note"><span class="info">i</span><span>旧记录仍按原有情绪和诱因展示；新字段只在用户主动选择后保存。</span></div>
      <div class="label-row"><strong>备注（可选）</strong><span>原有字段</span></div><div class="note-box">想记点什么，就写点什么</div>
      <div class="actions"><button class="secondary" id="cancel">取消</button><button class="primary" id="save">保存记录</button></div>
      <pre class="state" id="state"></pre>
    </section>
  </main>
  <script>
    const state = { context: ['无聊'], before: '无聊', after: ['平静'], plan: null };
    const stateEl = document.getElementById('state');
    const toast = document.getElementById('toast');
    function sync() {
      document.querySelectorAll('[data-group]').forEach((groupEl) => {
        const group = groupEl.dataset.group;
        groupEl.querySelectorAll('.chip').forEach((chip) => {
          const value = chip.dataset.value;
          const active = Array.isArray(state[group]) ? state[group].includes(value) : state[group] === value;
          chip.classList.toggle('active', active);
        });
      });
      stateEl.textContent = JSON.stringify({ beforeContext: state.context, beforeState: state.before, afterFeeling: state.after, planFit: state.plan }, null, 2);
    }
    document.addEventListener('click', (event) => {
      const chip = event.target.closest('.chip');
      if (chip) {
        const group = chip.parentElement.dataset.group;
        const value = chip.dataset.value;
        if (Array.isArray(state[group])) state[group] = state[group].includes(value) ? state[group].filter((item) => item !== value) : [...state[group], value];
        else state[group] = state[group] === value ? null : value;
        sync();
      }
      if (event.target.closest('#save')) { toast.textContent = '记录已保存 ✓'; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1400); }
      if (event.target.closest('#cancel')) { toast.textContent = '已取消，未保存复盘'; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1400); }
    });
    sync();
  </script>
</body>
</html>
