<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 A · 全页分组（Apple 设置页同构）</title>
<style>
:root {
  --bg: #F2F2F7; --bg-elev: #FFFFFF; --card: #FFFFFF;
  --ink: #000000; --ink-2: #6E6E73; --ink-3: #C7C7CC;
  --line: #E5E5EA; --accent: #007AFF; --accent-deep: #0062CC; --sage: #34C759;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Segoe UI", sans-serif;
  --shadow-2: 0 4px 14px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.05);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #D9D9DE; font-family: var(--font); }
.stage { display: flex; justify-content: center; padding: 24px 0; min-height: 100vh; }
.phone { width: 390px; height: 844px; background: var(--bg); border-radius: 44px; border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 20px 60px rgba(0,0,0,0.2); overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }
.statusbar { height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
.screen { flex: 1; padding: 4px 16px 40px; }
.page-head { display: flex; align-items: baseline; gap: 10px; padding: 8px 4px 12px; }
.page-head h1 { font-size: 28px; font-weight: 800; }
.page-head span { font-size: 13px; color: var(--ink-3); }

/* ===== iOS settings-grouped 语言 ===== */
.section-head { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin: 20px 12px 8px; }
.group {
  background: var(--card); border-radius: 14px; overflow: hidden;
  box-shadow: var(--shadow-2);
}
.group .row {
  width: 100%; display: flex; align-items: center; gap: 10px;
  background: none; border: none; border-bottom: 0.5px solid var(--line);
  padding: 13px 14px; font-size: 14px; font-family: var(--font); color: var(--ink);
  cursor: pointer; text-align: left;
}
.group .row:last-child { border-bottom: none; }
.group .row .sub { font-size: 11px; color: var(--ink-3); font-weight: 400; }
.group .row .chev { margin-left: auto; color: var(--ink-3); flex-shrink: 0; display: flex; }
.group .row .val { margin-left: auto; font-size: 13px; color: var(--ink-2); }
.group .row.disabled { opacity: 0.45; cursor: not-allowed; }
.group .row.sw { justify-content: space-between; }
.group .row.danger { color: var(--accent-deep); }
.group .row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.gray { background: var(--ink-3); } .dot.green { background: var(--sage); }
.group .btn-primary {
  display: block; width: calc(100% - 28px); margin: 8px 14px; text-align: center;
  background: var(--accent); color: #FFF; border: none; border-radius: 999px;
  padding: 13px; font-size: 15px; font-weight: 600; font-family: var(--font); cursor: pointer;
}
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--bg-elev); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-family: var(--font); cursor: pointer; }
.chip.active { background: var(--accent); border-color: var(--accent); color: #FFF; }
.switch { width: 51px; height: 31px; border-radius: 16px; background: #E9E9EB; position: relative; transition: background 0.2s; flex-shrink: 0; }
.switch.on { background: var(--sage); }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFF; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: left 0.2s; }
.switch.on .knob { left: 22px; }
.switch.disabled { opacity: 0.4; }
.about { text-align: center; padding: 18px 14px; }
.about .name { font-size: 15px; font-weight: 700; }
.about .ver { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
.about .privacy { font-size: 11px; color: var(--ink-2); margin-top: 8px; line-height: 1.7; }
.proto-toggle { display: flex; gap: 8px; margin: 10px 0 2px; }
.proto-toggle .chip { flex: 1; justify-content: center; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="stage"><div class="phone">
  <div class="statusbar"><span>9:41</span></div>
  <div class="screen">
    <div class="page-head"><h1>我的</h1><span>设置</span></div>

    <div class="proto-toggle" id="stateChips">
      <button class="chip active" data-state="plain">明文</button>
      <button class="chip" data-state="enc">加密</button>
      <button class="chip" data-state="enc+wd">加密+服务器</button>
    </div>

    <!-- 外观与显示 -->
    <p class="section-head">外观与显示</p>
    <div class="group">
      <div class="row" style="flex-wrap:wrap;gap:8px"><span>外观</span><span class="chips" style="margin-left:auto"><button class="chip active">跟随系统</button><button class="chip">浅色</button><button class="chip">深色</button></span></div>
      <div class="row sw"><span>玻璃效果</span><span class="switch"><span class="knob"></span></span></div>
      <div class="row"><span>记录方式</span><span class="val">计时</span><span class="chev"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    </div>

    <!-- 提醒 -->
    <p class="section-head">提醒</p>
    <div class="group">
      <div class="row sw"><span>每日温和提醒</span><span class="switch on"><span class="knob"></span></span></div>
      <div class="row sw"><span>连续记录里程碑肯定</span><span class="switch"><span class="knob"></span></span></div>
      <div class="row"><span>实况通知</span><span class="val">测试</span><span class="chev"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    </div>

    <!-- AI 与数据 -->
    <p class="section-head">AI 与数据</p>
    <div class="group">
      <div class="row"><span>AI 设置</span><span class="val">DeepSeek</span><span class="chev"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="row" id="aEncRow"><span class="dot gray"></span><span id="aEncText">未加密 · 记录以明文保存在本机</span></div>
      <button class="btn-primary" id="aEncBtn">开启加密</button>
      <button class="btn-primary hidden" id="aDecBtn">关闭加密</button>
      <div class="row hidden" id="aChgBtn"><span>修改口令</span><span class="chev"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="row" id="aBkpBtn"><span>立即备份</span><span class="sub" id="aBkpSub" style="margin-left:auto">开启加密后可用</span><span class="chev"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="row"><span>恢复数据</span><span class="sub" style="margin-left:auto">本机 / 服务器</span><span class="chev"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="row"><span>备份文件</span><span class="val" id="aWdVal">未配置</span><span class="chev"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="row sw" id="aAutoRow"><span>离开 App 时自动备份</span><span class="switch disabled" id="aAutoSw"><span class="knob"></span></span></div>
      <div class="row danger"><span>清除全部数据</span><span class="chev"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="row danger"><span>恢复演示数据</span><span class="chev"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    </div>

    <!-- 关于 -->
    <p class="section-head">关于</p>
    <div class="group about">
      <p class="name">观己</p>
      <p class="ver">v3.10 · 数据默认仅存本地</p>
      <p class="privacy">所有记录只保存在这台设备上<br>AI 分析仅上传聚合统计特征，不涉及单条记录</p>
    </div>

  </div>
</div></div>

<script>
  const $ = (id) => document.getElementById(id);
  function setState(s) {
    const enc = s !== 'plain'; const wd = s === 'enc+wd';
    document.querySelectorAll('#stateChips .chip').forEach((c) => c.classList.toggle('active', c.dataset.state === s));
    $('aEncBtn').classList.toggle('hidden', enc);
    $('aDecBtn').classList.toggle('hidden', !enc);
    $('aChgBtn').classList.toggle('hidden', !enc);
    $('aEncRow').querySelector('.dot').className = 'dot ' + (enc ? 'green' : 'gray');
    $('aEncText').textContent = enc ? '已加密 · 离开设备的数据都是密文' : '未加密 · 记录以明文保存在本机';
    $('aBkpBtn').classList.toggle('disabled', !enc);
    $('aBkpSub').textContent = enc ? '生成加密备份文件' : '开启加密后可用';
    $('aWdVal').textContent = wd ? '已配置 · 09:14' : '未配置';
    $('aAutoSw').classList.toggle('disabled', !wd);
    $('aAutoRow').classList.toggle('disabled', !wd);
  }
  $('stateChips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) setState(c.dataset.state); });
  setState('plain');
</script>
</body>
</html>
