apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'   // 小组件/插件 Kotlin 源码（WidgetStatsPlugin 等）
apply plugin: 'kotlin-kapt'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.guanji.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.guanji.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
          // #279：备份/恢复与 WebDAV 经典模式迁移。
          versionCode 134
          versionName "4.2.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        compose true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 正式签名只从环境变量读取，禁止把密钥提交进仓库。
            // GitHub 历史发行包使用正式包名 + Android Debug 签名；仅由构建钩子显式开启，
            // 不改变默认的正式签名安全边界。
            def useDebugSigning = System.getenv('GUANJI_RELEASE_USE_DEBUG_SIGNING') == 'true'
            def releaseStoreFile = System.getenv('GUANJI_RELEASE_KEYSTORE')
            def releaseStorePassword = System.getenv('GUANJI_RELEASE_STORE_PASSWORD')
            def releaseKeyAlias = System.getenv('GUANJI_RELEASE_KEY_ALIAS')
            def releaseKeyPassword = System.getenv('GUANJI_RELEASE_KEY_PASSWORD')
            if (useDebugSigning) {
                signingConfig = signingConfigs.debug
            } else if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig = signingConfigs.create('guanjiRelease')
                signingConfig.storeFile = file(releaseStoreFile)
                signingConfig.storePassword = releaseStorePassword
                signingConfig.keyAlias = releaseKeyAlias
                signingConfig.keyPassword = releaseKeyPassword
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// #273：Compose 1.7.6/Material3 1.3.1 仅使用本机已缓存的 AndroidX 补丁版本，
// 防止离线构建把迁移脚手架解析到未缓存的生命周期工件。
configurations.configureEach {
    resolutionStrategy {
        force 'androidx.activity:activity-compose:1.10.0'
        force 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
        force 'androidx.lifecycle:lifecycle-common-java8:2.8.7'
        force 'androidx.lifecycle:lifecycle-livedata:2.6.2'
        force 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
        force 'androidx.lifecycle:lifecycle-runtime:2.6.2'
        force 'androidx.lifecycle:lifecycle-common:2.6.2'
        force 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2'
        force 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
        force 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
        implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.room:room-runtime:$androidxRoomVersion"
    implementation "androidx.sqlite:sqlite:$androidxSqliteVersion"
    implementation "net.zetetic:sqlcipher-android:$sqlcipherAndroidVersion"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.compose.ui:ui:1.7.6"
    implementation "androidx.compose.runtime:runtime:1.7.6"
    implementation "androidx.compose.foundation:foundation:1.7.6"
    implementation "androidx.compose.animation:animation-core:1.7.6"
    kapt "androidx.room:room-compiler:$androidxRoomVersion"
        implementation project(':capacitor-android')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'   // #115：WebDAV 任意方法（PROPFIND/MKCOL）
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

